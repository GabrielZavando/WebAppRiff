# Static server for the Angular admin panel (SPA): unknown routes fall back to
# index.html so client-side routing works on deep links.
#
# NOTE (nginx add_header inheritance): an `add_header` directive at a `location`
# level SHADOWS all `add_header` directives of the enclosing level. To avoid
# losing security headers on any served document (including index.html served via
# SPA fallback), each location that emits `add_header Cache-Control` also repeats
# the full security header set explicitly.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Content-hashed Angular build assets: immutable, long cache + security headers.
  location ~* /assets/.*\.(?:js|css)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' https:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'" always;
  }

  # index.html (SPA bootstrap): no-cache + full security headers (repeated because
  # this location defines add_header, shadowing sibling inheritance).
  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' https:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'" always;
  }

  # SPA fallback: any internal route serves index.html so client routing works.
  # Full security headers repeated here as well.
  location / {
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' https:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    try_files $uri /index.html;
  }
}