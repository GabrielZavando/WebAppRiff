# Static server for the Astro public site (MPA: each route is a directory with
# index.html). Content-hashed /_astro/ assets are cached immutably; HTML is
# served no-cache (so catalog updates are picked up). No SPA fallback: unknown
# paths hit Astro's generated 404.html.
#
# NOTE (nginx add_header inheritance): an `add_header` directive at a `location`
# level SHADOWS all enclosing-level `add_header` directives. Each location that
# emits an `add_header Cache-Control` therefore also repeats the full security
# header set explicitly so no HTML document loses CSP / X-Frame-Options / etc.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Content-hashed Astro assets: immutable + security headers (repeated).
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' https:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'" always;
  }

  # Root index.html: no-cache + full security headers (repeated).
  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' https:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'" always;
  }

  # Any other HTML page / route: no-cache + full security headers (repeated).
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' https:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    try_files $uri $uri/ =404;
  }

  error_page 404 /404.html;
}