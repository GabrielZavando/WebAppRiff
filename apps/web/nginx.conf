# Static server for the Astro public site (MPA: each route is a directory with
# index.html). Content-hashed /_astro/ assets are cached immutably; HTML is
# revalidated. No SPA fallback: unknown paths hit Astro's generated 404.html.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri $uri/ =404;
  }

  error_page 404 /404.html;
}
