name: Deploy web staging

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modo de ejecución: listar (solo lectura) o desplegar (publicación)'
        required: true
        type: choice
        default: listar
        options:
          - listar
          - desplegar

permissions:
  contents: read

concurrency:
  group: deploy-web-staging
  cancel-in-progress: false

jobs:
  ftp-access-check:
    name: FTP access check (read-only)
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp
      - name: Refuse publish mode until the publication stage exists
        if: ${{ inputs.mode == 'desplegar' }}
        run: |
          echo "::error::El modo 'desplegar' todavia no esta implementado en esta version del workflow. Solo se permite el modo 'listar' (solo lectura)."
          exit 1
      - name: List remote directory over FTPES
        if: ${{ inputs.mode == 'listar' }}
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          bash scripts/deploy/list-remote.sh
