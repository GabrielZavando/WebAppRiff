name: Deploy web staging

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modo de ejecución: listar (solo lectura) o desplegar (publicación)'
        required: true
        type: choice
        default: listar
        options:
          - listar
          - desplegar

permissions:
  contents: read

concurrency:
  group: deploy-web-staging
  cancel-in-progress: false

jobs:
  ftp-access-check:
    name: FTP access check (read-only)
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp
      - name: List remote directory over FTPES
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          bash scripts/deploy/list-remote.sh

  publish:
    name: Publicar sitio web en staging
    needs: ftp-access-check
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    if: ${{ inputs.mode == 'desplegar' }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Instalar Node 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - name: Validar variables de environment de staging
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          NESTJS_API_URL: ${{ vars.NESTJS_API_URL }}
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
        run: |
          for var in SITE_URL NESTJS_API_URL PUBLIC_API_URL; do
            if [ -z "${!var}" ]; then
              echo "::error::Falta la variable ${var} en el GitHub Environment 'staging'" >&2
              exit 1
            fi
          done
      - name: Instalar dependencias (npm ci)
        run: npm ci
      - name: Comprobar que el lockfile no cambió
        run: git diff --exit-code package-lock.json
      - name: Construir el sitio público
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          NESTJS_API_URL: ${{ vars.NESTJS_API_URL }}
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
          REQUIRE_API: 'true'
        run: npm run build --workspace=@riff/web
      - name: Verificar contrato de .htaccess antes de publicar
        run: npm run verify:htaccess --workspace=@riff/web
      - name: Instalar lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp
      - name: Subir _astro/ primero (assets con hash)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          bash scripts/deploy/upload-web.sh apps/web/dist _astro
      - name: Subir el resto del build
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          bash scripts/deploy/upload-web.sh apps/web/dist rest
      - name: Smoke test del sitio publicado
        env:
          SMOKE_WEB_URL: https://staging.somosriff.cl
        run: npm run smoke:web
      - name: Verificar cabeceras de la home y de un asset de _astro/
        env:
          SMOKE_WEB_URL: https://staging.somosriff.cl
        run: |
          ASTRO_ASSET="$(find apps/web/dist/_astro -type f -print -quit | sed 's|apps/web/dist/||')"
          curl -I "https://staging.somosriff.cl/"
          curl -I "https://staging.somosriff.cl/${ASTRO_ASSET}"
