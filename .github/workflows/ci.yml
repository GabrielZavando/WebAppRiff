name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

env:
  # Consumer auth (Vía A): GITHUB_TOKEN + packages:read downloads
  # @gabrielzavando/specboot from GitHub Packages (declared in devDependencies).
  # NOTE: re-apply after `specboot update` — it replaces this intocable file.
  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  validate:
    name: Framework self-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
      - name: Install framework deps
        run: npm install
      - name: check-refs
        run: bash check-refs.sh
      - name: specboot ci (dogfooding)
        run: bash specboot.sh --ci
      - name: Run framework self-tests (dogfooding)
        if: ${{ hashFiles('tests/*-test.sh') != '' }}
        run: |
          for t in tests/*-test.sh; do
            echo "→ running $t"
            bash "$t"
          done

  project-ci:
    name: Project CI gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
      - name: Install framework deps
        run: npm install
      - name: check-refs
        run: bash check-refs.sh
      - name: SOLID/DIP static analysis
        run: make solid-lint
      - name: lint (no --fix, non-mutating)
        run: npm run lint --workspaces
      - name: typecheck (all workspaces, --if-present)
        run: npm run typecheck --workspaces --if-present
      - name: build (all workspaces)
        run: npm run build --workspaces
      - name: backend tests with coverage (>=90% blocking via jest thresholds)
        run: npm run test:cov --workspace=apps/backend
      - name: web tests
        run: npm run test --workspace=apps/web
      - name: admin tests
        run: npm run test --workspace=apps/admin
      - name: shared package (html-sanitize) tests
        run: npm run test --workspace=packages/html-sanitize
      - name: npm audit (blocking, with suppressions)
        run: npm run audit
