name: CI

# CI del proyecto Riff Catálogo Digital.
# Validación de OpenSpec (specs + changes) + gate de proyecto vía Makefile
# + gate de builds Docker (admin y web) en una lane paralela: los builds en
# contenedor son lentos (5-10 min) y no comparten dependencias con el job `ci`
# (change deploy-docker-hardening).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Project gate (openspec validate + lint + typecheck + test + audit)
        if: ${{ hashFiles('Makefile') != '' }}
        run: make ci

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build Docker images (admin + web, test args, no push)
        if: ${{ hashFiles('Makefile') != '' }}
        run: make docker-build