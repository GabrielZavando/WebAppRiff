name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

# Consumer auth for GitHub Packages (fix-consumer-mode / SC-004): setup-node's
# registry-url writes ~/.npmrc with `_authToken=${NODE_AUTH_TOKEN}` on the
# runner; without this env the consumer's `npm install` hits E401 on
# npm.pkg.github.com. Inert in dogfooding: this repo installs no GitHub
# Packages dependencies, and its own GITHUB_TOKEN can read its own packages.
env:
  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  validate:
    name: Framework self-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
      - name: Install framework deps
        run: npm install
      - name: check-refs
        run: bash check-refs.sh
      - name: specboot ci (dogfooding)
        run: bash specboot.sh --ci
      - name: Run framework self-tests (dogfooding)
        if: ${{ hashFiles('tests/*-test.sh') != '' }}
        run: |
          for t in tests/*-test.sh; do
            echo "→ running $t"
            bash "$t"
          done

  project-ci:
    name: Project CI gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
      - name: Install framework deps
        run: npm install
      - name: make ci (refs + solid-lint + lint + test + audit)
        run: make ci
