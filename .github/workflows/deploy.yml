name: Deploy to Coolify

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-staging:
    name: Deploy frontends staging (web + admin)
    runs-on: ubuntu-latest
    steps:
      - name: Trigger riff-web-staging deploy
        env:
          WEBHOOK_URL: ${{ secrets.COOLIFY_WEB_STAGING_WEBHOOK_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          if [ -z "$WEBHOOK_URL" ] || [ -z "$COOLIFY_API_TOKEN" ]; then
            echo "::warning::COOLIFY_WEB_STAGING_WEBHOOK_URL or COOLIFY_API_TOKEN is not set - skipping riff-web-staging deploy"
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$WEBHOOK_URL" -H "Authorization: Bearer $COOLIFY_API_TOKEN" --max-time 60

      - name: Trigger riff-admin-staging deploy
        env:
          WEBHOOK_URL: ${{ secrets.COOLIFY_ADMIN_STAGING_WEBHOOK_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          if [ -z "$WEBHOOK_URL" ] || [ -z "$COOLIFY_API_TOKEN" ]; then
            echo "::warning::COOLIFY_ADMIN_STAGING_WEBHOOK_URL or COOLIFY_API_TOKEN is not set - skipping riff-admin-staging deploy"
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$WEBHOOK_URL" -H "Authorization: Bearer $COOLIFY_API_TOKEN" --max-time 60
