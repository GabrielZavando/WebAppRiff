name: CI

# Consumer CI workflow template (templates/github/workflows/consumer-ci.yml).
#
# Installed by `specboot init` (and refreshed by `specboot update`) into the
# consumer project as `.github/workflows/ci.yml`. It is the ONLY workflow the
# framework installs by default. It is NOT the Specboot repository's own
# workflow (the internal release/deploy workflows are repo-only and never
# shipped to consumers).
#
# Non-functional wiring preserved (SC-004 of consumer-ci-auth): GitHub Packages
# auth via `packages: read` + `NODE_AUTH_TOKEN`, setup-node with the registry,
# Node 24, actions v5, and `hashFiles` only at step level.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

env:
  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  ci:
    name: Consumer CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
      - name: Install dependencies
        run: npm ci --ignore-scripts || npm install --ignore-scripts
      - name: Specboot structural validation
        run: bash specboot.sh --ci
      - name: Project gate (make ci: refs + solid-lint + lint + test + audit)
        if: ${{ hashFiles('Makefile') != '' }}
        run: make ci
