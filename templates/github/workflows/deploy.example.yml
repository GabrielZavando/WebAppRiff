name: Deploy

# Optional consumer deploy template (templates/github/workflows/deploy.example.yml).
#
# This file is an EXAMPLE: `specboot init`/`specboot update` NEVER install it
# automatically. To use it, copy it into your project as
# `.github/workflows/deploy.yml` and adapt it to your infrastructure.
#
# Agnostic: parametrized exclusively via GitHub repo `vars` and `secrets`
# (DOCKER_REPO, DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY), gated at job level by
# `vars.DEPLOY_ENABLED`. Build/SSH steps are additionally gated on step-level
# `hashFiles` for a Dockerfile. No framework-specific infrastructure is hardcoded.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    if: vars.DEPLOY_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v5
      - name: Check Dockerfile exists
        id: dockerfile
        if: ${{ hashFiles('Dockerfile') != '' }}
        run: echo "dockerfile-present=true" >> "$GITHUB_OUTPUT"
      - name: Build image
        if: steps.dockerfile.outputs.dockerfile-present == 'true'
        run: docker build -t ${{ vars.DOCKER_REPO }}:staging .
      - name: Deploy via SSH
        if: steps.dockerfile.outputs.dockerfile-present == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            docker pull ${{ vars.DOCKER_REPO }}:staging
            docker stop app-staging || true
            docker rm app-staging || true
            docker run -d --name app-staging ${{ vars.DOCKER_REPO }}:staging

  deploy-production:
    name: Deploy to production
    runs-on: ubuntu-latest
    if: vars.DEPLOY_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5
      - name: Check Dockerfile exists
        id: dockerfile
        if: ${{ hashFiles('Dockerfile') != '' }}
        run: echo "dockerfile-present=true" >> "$GITHUB_OUTPUT"
      - name: Build image
        if: steps.dockerfile.outputs.dockerfile-present == 'true'
        run: docker build -t ${{ vars.DOCKER_REPO }}:production .
      - name: Deploy via SSH
        if: steps.dockerfile.outputs.dockerfile-present == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            docker pull ${{ vars.DOCKER_REPO }}:production
            docker stop app-prod || true
            docker rm app-prod || true
            docker run -d --name app-prod ${{ vars.DOCKER_REPO }}:production

  rollback:
    name: Rollback production
    runs-on: ubuntu-latest
    if: failure() && vars.DEPLOY_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5
      - name: Rollback via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            docker stop app-prod || true
            docker rm app-prod || true
            docker run -d --name app-prod ${{ vars.DOCKER_REPO }}:previous
